# Pipeline diario: baja lo ya publicado, ingiere lo nuevo de cada fuente, lo
# publica y recien despues transforma y testea.
#
# Corre todos los dias aunque las fuentes sean mensuales: casi siempre no hay
# nada nuevo y termina rapido, pero los tests de frescura (contra la fecha de
# hoy) tienen que correr igual para avisar si una fuente se atrasa. El repo es
# publico, asi que los minutos de Actions no tienen costo.
name: Pipeline

on:
  schedule:
    # 10:23 UTC = 07:23 en Argentina. No en punto: GitHub demora los cron de
    # las horas redondas, que son los mas cargados.
    - cron: "23 10 * * *"
  workflow_dispatch:
  # Un cambio de codigo (sitio, exportacion, ingestas, dbt, calculo) se prueba
  # y publica al pushear, sin esperar a la corrida del dia siguiente.
  push:
    branches: [main]
    paths:
      - "sitio/**"
      - "exportar/**"
      - "ingesta/**"
      - "transform/**"
      - "costo/**"
      - "requirements.txt"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: write # crear releases y subirles archivos

concurrency:
  group: pipeline
  cancel-in-progress: false # nunca cortar una corrida a mitad de una subida

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      sitio: ${{ steps.empaquetar.outcome }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Tests de las utilidades
        run: |
          python -m ingesta.test_releases
          python -m ingesta.test_texto

      - name: Bajar datos ya publicados
        run: python -m ingesta.releases bajar

      - name: Ingesta DNRPA
        run: python -m ingesta.dnrpa

      # Las ingestas son independientes: si una falla, la otra corre igual y lo
      # que se haya ingerido se publica. El job queda en rojo de todos modos.
      - name: Ingesta combustible
        if: ${{ !cancelled() }}
        run: python -m ingesta.combustible

      - name: Ingesta valuacion fiscal
        if: ${{ !cancelled() }}
        run: python -m ingesta.valuacion

      # La guia CCA se pisa cada mes en la misma URL: el mes que no se captura
      # se pierde. Por eso corre todos los dias, aunque cambie una vez por mes.
      - name: Ingesta guia CCA
        if: ${{ !cancelled() }}
        run: python -m ingesta.cca

      - name: Ingesta consumo (fuente congelada, solo la primera vez)
        if: ${{ !cancelled() }}
        run: python -m ingesta.consumo

      # Tipo de cambio minorista del BCRA, para pasar a pesos las fuentes en
      # dolares (service de BYD).
      - name: Ingesta tipo de cambio
        if: ${{ !cancelled() }}
        run: python -m ingesta.cambio

      # Precios oficiales de service (Fiat, Jeep, Peugeot, Citroen, VW, Toyota,
      # Renault, BYD). Se guarda una foto solo cuando la fuente cambia.
      - name: Ingesta service programado
        if: ${{ !cancelled() }}
        run: python -m ingesta.service

      # Repuestos de desgaste (Repuestos Express): ~230 paginas, como maximo una
      # vez por semana; el resto de los dias termina enseguida.
      - name: Ingesta repuestos
        if: ${{ !cancelled() }}
        run: python -m ingesta.repuestos

      - name: Publicar datos nuevos o modificados
        if: ${{ !cancelled() }}
        run: python -m ingesta.releases subir

      # dbt corre aunque una ingesta haya fallado: usa lo ya publicado de esa
      # fuente (un dia menos fresco), y la corrida igual queda en rojo.
      - name: dbt deps y seed
        id: seed
        if: ${{ !cancelled() }}
        run: |
          dbt deps --project-dir transform --profiles-dir transform
          dbt seed --project-dir transform --profiles-dir transform

      # run y test por separado, como en SEPA: un test que falla no debe
      # impedir que se construyan los modelos de abajo.
      - name: dbt run
        id: run
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        run: dbt run --project-dir transform --profiles-dir transform

      - name: dbt test
        id: test
        if: ${{ !cancelled() && steps.run.outcome == 'success' }}
        run: dbt test --project-dir transform --profiles-dir transform

      # El calculo del comparador (Python) tiene que dar lo mismo que
      # mart_costo_total (dbt): si una formula cambia de un solo lado, falla.
      - name: Test del calculo de costo
        id: costo
        if: ${{ !cancelled() }}
        run: python -m costo.test_calculo

      # El calculo en JavaScript (el del comparador del sitio) tiene que dar lo
      # mismo que Python con los casos compartidos de costo/casos_prueba.json.
      - name: Test del calculo en JavaScript
        id: js
        if: ${{ !cancelled() }}
        run: node sitio/js/test_costo.mjs

      # Los marts pasan a JSON estaticos: la "API" del sitio son estos archivos.
      - name: Exportar datos del sitio
        id: exportar
        if: ${{ !cancelled() && steps.run.outcome == 'success' }}
        run: python -m exportar.sitio

      # El sitio se publica si los datos pasaron todos los controles, aunque
      # una ingesta haya fallado: muestra datos validos, apenas menos frescos.
      - name: Empaquetar el sitio
        id: empaquetar
        if: >-
          ${{ !cancelled() && steps.test.outcome == 'success' && steps.costo.outcome == 'success'
          && steps.js.outcome == 'success' && steps.exportar.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  # GitHub Pages (Settings -> Pages -> Source: GitHub Actions): el sitio es
  # estatico y gratis para repos publicos, y se actualiza solo con cada
  # corrida. Si un test de datos falla, no se empaqueta y queda en linea la
  # version anterior en vez de una con datos dudosos.
  publicar:
    needs: pipeline
    if: ${{ !cancelled() && needs.pipeline.outputs.sitio == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
