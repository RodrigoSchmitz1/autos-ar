name: autos_ar
version: "0.1.0"
config-version: 2
profile: autos_ar

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Las rutas a datos/raw son relativas a la raiz del repo: dbt se corre siempre
# desde ahi, con --project-dir transform.
vars:
  raw: "datos/raw"

models:
  autos_ar:
    staging:
      +materialized: view
    intermedios:
      +materialized: table
    marts:
      +materialized: table

seeds:
  autos_ar:
    # Los codigos con cero adelante ("02", "06") son texto, no numeros.
    provincias:
      +column_types:
        provincia_id: varchar
    provincias_variantes:
      +column_types:
        provincia_id: varchar
    # Patente: curada a mano desde cada ley impositiva, con el articulo de cada dato.
    patente_escalas:
      +column_types:
        provincia_id: varchar
        base_desde: double
        base_hasta: double
        cuota_fija: double
        alicuota_pct: double
        valuacion_minima: double
        minimo_anual: double
    patente_reglas:
      +column_types:
        provincia_id: varchar
        coeficiente_base: double
        tope_tasa_efectiva_pct: double
        recargo_pct: double
    banderas:
      +column_types:
        bandera_fuente: varchar
    # Correcciones a mano de los cruces por texto. Arranca vacia: se carga
    # cuando una revision encuentra un cruce mal hecho.
    revisiones_mapeo:
      +column_types:
        fuente: varchar
        origen_codigo: varchar
        marca_codigo: varchar
        tipo_codigo: varchar
        modelo_codigo: varchar
        modelo_asignado: varchar
        motivo: varchar

flags:
  send_anonymous_usage_stats: false
