version: 2

models:
  - name: dim_version
    description: >
      Catalogo canonico de versiones (codigo DNRPA) con sus cruces a la
      valuacion fiscal, la guia CCA y el consumo, y el metodo de cada cruce.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [origen_codigo, marca_codigo, tipo_codigo, modelo_codigo]
    columns:
      - name: cca_metodo
        data_tests:
          - accepted_values:
              arguments:
                values: ["alias", "prefijo", "prefijo_ambiguo", "revision_manual"]

  - name: cobertura_mapeos
    description: Porcentaje del mercado que cruza con cada fuente (por versiones, tramites y 0 km).
    columns:
      - name: fuente
        data_tests: [unique, not_null]

  - name: mart_mercado_mensual
    description: Tramites por mes, provincia, tipo de tramite, marca y modelo comercial.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [periodo, provincia_id, tramite, segmento, marca, familia, familia_fuente, origen]
    columns:
      - name: unidades
        data_tests: [not_null]

  - name: mart_depreciacion
    description: >
      Proporcion del valor 0 km que conserva un auto con N anios, fiscal y de
      mercado, por indice encadenado.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [marca, familia, antiguedad]
    columns:
      - name: proporcion_fiscal
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1.5
      - name: proporcion_mercado
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1.5

  - name: mart_combustible_mensual
    description: Precio y volumen por mes, provincia, producto y bandera (Res. 1104, venta al publico).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [periodo, provincia_id, producto, bandera]
    columns:
      - name: precio_mediano
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

  - name: mart_combustible_estaciones
    description: Ultimo mes completo por estacion y producto, con ubicacion.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [nro_inscripcion, producto]
    columns:
      - name: latitud
        data_tests: [not_null]
      - name: longitud
        data_tests: [not_null]

  - name: mart_patente_estimada
    description: >
      Patente anual estimada por provincia, version y anio modelo, desde la
      escala de cada ley impositiva (seeds patente_reglas y patente_escalas).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [provincia_id, anio_fiscal, origen_codigo, marca_codigo, tipo_codigo, modelo_codigo, anio_modelo]
    columns:
      - name: patente_anual
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

  - name: mart_service
    description: Costo del service oficial por modelo (lista vigente) y costo por km del plan completo.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [marca, modelo_fuente]
    columns:
      - name: costo_por_km
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 200
