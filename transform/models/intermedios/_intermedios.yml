version: 2

models:
  - name: int_versiones
    description: Una fila por version (codigo DNRPA) con al menos un tramite desde 2018.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [origen_codigo, marca_codigo, tipo_codigo, modelo_codigo]
    columns:
      - name: marca
        data_tests: [not_null]
      - name: modelo
        data_tests: [not_null]

  - name: int_valuacion_version
    description: Valor fiscal vigente por version y anio (anio 0 = 0 km).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [origen_codigo, marca_codigo, tipo_codigo, modelo_codigo, anio]
    columns:
      - name: valor_fiscal
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1000
      - name: metodo
        data_tests:
          - accepted_values:
              arguments:
                values: ["codigo", "codigo_desempate_texto"]

  - name: int_mapeo_texto
    description: Cruce por texto de cada version con la guia CCA y con el consumo.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [origen_codigo, marca_codigo, tipo_codigo, modelo_codigo]
    columns:
      - name: cca_metodo
        data_tests:
          - accepted_values:
              arguments:
                values: ["alias", "prefijo", "prefijo_ambiguo", "excluido"]
      - name: consumo_metodo
        data_tests:
          - accepted_values:
              arguments:
                values: ["alias", "prefijo", "prefijo_ambiguo", "excluido"]
